[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GitPilot"
version = "1.2.0"
description = "A safety-first Git automation CLI tool that watches repositories, generates conventional commits, and manages remote sync."
authors = [
    {name = "Preet Dudhat", email = "dudhatpreet20@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "watchdog>=3.0.0"
]

[project.scripts]
gitpilot = "gitpilot.cli:main"

[tool.setuptools]
packages = ["gitpilot"]
